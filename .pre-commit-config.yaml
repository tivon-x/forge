repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format
        language: system
        files: \.py$
        exclude: ^\.agents/
        types: [python]
      - id: ruff-check
        name: Ruff check
        entry: uv run --locked ruff check
        language: system
        files: \.py$
        exclude: ^\.agents/
        types: [python]
