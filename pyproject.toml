[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "forge-ai"
version = "0.3.1"
description = "A LangChain-backed, provider-neutral Python coding-agent CLI inspired by Pi and derived from the Tau Python baseline."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.0",
    "httpx[socks]>=0.27",
    "langchain>=1.3.14,<2.0",
    "langchain-openai==1.4.1",
    "packaging>=24.0",
    "pydantic>=2.0",
    "pygments>=2.18",
    "rich>=13.0",
    "textual>=1.0",
    "typer>=0.12",
]

[project.urls]
Pi = "https://github.com/earendil-works/pi"
Tau = "https://github.com/huggingface/tau"

[project.scripts]
forge = "forge_cli.cli:app"

[project.optional-dependencies]
providers = [
    "langchain-anthropic>=1.3,<2",
    "langchain-google-genai>=4,<5",
    "langchain-mistralai>=1,<2",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/forge_agent", "src/forge_coding", "src/forge_cli"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["forge_agent", "forge_coding", "forge_cli"]

[[tool.mypy.overrides]]
module = "pygments.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: uses preinstalled rg/fd and is opt-in via FORGE_RUN_INTEGRATION=1",
]
